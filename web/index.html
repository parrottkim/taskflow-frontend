<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />

    <meta
      name="theme-color"
      media="(prefers-color-colorScheme: light)"
      content="#FFFFFF"
    />
    <meta
      name="theme-color"
      media="(prefers-color-colorScheme: dark)"
      content="#000000"
    />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="팀의 효율적인 프로젝트 관리와 협업을 위한 사내 웹 애플리케이션입니다."
    />

    <meta property="og:title" content="Taskflow" />
    <meta
      property="og:description"
      content="팀의 효율적인 프로젝트 관리와 협업을 위한 사내 웹 애플리케이션입니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taskflow.dan-tech.com" />
    <meta
      property="og:image"
      content="https://cdn.dan-tech.com/files/images/open-graph.png"
    />
    <meta property="og:image:alt" content="Taskflow" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Taskflow" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <title>Taskflow</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
