name: CI/CD Workflow for TaskFlow Frontend

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  IMAGE_DEV: dantechhjkim/frontend-dev
  IMAGE_PROD: dantechhjkim/frontend-prod
  COMPOSE_FILE: docker-compose.yml
  REMOTE_DIR: 'D:/01-Projects/taskflow/frontend'

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      env: ${{ steps.set_env.outputs.env }}
      service: ${{ steps.set_env.outputs.service }}
      compose_file: ${{ steps.set_env.outputs.compose_file }}
      remote: ${{ steps.set_env.outputs.remote }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      - name: Set deployment environment and outputs
        id: set_env
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          
          if [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "IMAGE_NAME=${IMAGE_DEV}" >> $GITHUB_ENV
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "service=frontend-dev" >> $GITHUB_OUTPUT
            echo "SENTRY_PROJECT=taskflow-dev" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=${IMAGE_PROD}" >> $GITHUB_ENV
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "service=frontend-prod" >> $GITHUB_OUTPUT
            echo "SENTRY_PROJECT=taskflow-prod" >> $GITHUB_ENV
          fi
          
          echo "compose_file=docker-compose.yml" >> "$GITHUB_OUTPUT"
          echo "remote=${REMOTE_DIR}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release \
            --source-maps \
            --dart-define=ENVIRONMENT=${{ steps.set_env.outputs.env }} \
            --dart-define=SENTRY_RELEASE=${{ github.sha }} \
            --no-tree-shake-icons --base-href=/

      - name: Install Sentry CLI
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          echo "/home/runner/.local/bin" >> $GITHUB_PATH
          sentry-cli --version  # 설치 확인

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dan-tech-32
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          sentry-cli releases new $SENTRY_RELEASE
          sentry-cli sourcemaps upload --release=$SENTRY_RELEASE build/web --url-prefix '~/'
          sentry-cli releases finalize $SENTRY_RELEASE

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} \
            --build-arg ENVIRONMENT=${{ steps.set_env.outputs.env }} \
            --build-arg SENTRY_RELEASE=${{ github.sha }} .
          docker push ${{ env.IMAGE_NAME }}

      - name: Transfer Docker Compose to Windows host
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ env.REMOTE_DIR }}

  deploy:
    needs: build
    runs-on: [self-hosted, windows, taskflow-frontend]

    env:
      ENV: ${{ needs.build.outputs.env }}
      REMOTE_DIR: ${{ needs.build.outputs.remote }}
      COMPOSE_SERVICE: ${{ needs.build.outputs.service }}
      COMPOSE_FILE: ${{ needs.build.outputs.compose_file }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy service on Windows host
        shell: powershell
        run: |
          $RemoteDir = "${{ env.REMOTE_DIR }}"
          $Service = "${{ env.COMPOSE_SERVICE }}"
          $ComposeFile = "${{ env.COMPOSE_FILE }}"

          Set-Location -Path $RemoteDir

          Write-Host "Pulling latest image..."
          docker compose -f $ComposeFile pull $Service

          Write-Host "Bringing up service..."
          docker compose -f $ComposeFile up -d $Service

