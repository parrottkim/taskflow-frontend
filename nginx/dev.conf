# 1. HTTP -> HTTPS 리다이렉트 (Dev 공통)
server {
  listen 80;
  server_name dev.taskflow.dan-tech.com dev.cdn.dan-tech.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# 2. Dev Taskflow 애플리케이션 (SSL 8444)
server {
  listen 8444 ssl;
  http2 on;
  server_name dev.taskflow.dan-tech.com;

  # 개발 환경에서도 정확한 IP 파악을 위해 설정
  set_real_ip_from 172.18.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  access_log /var/log/nginx/dev_taskflow_access.log main;
  client_max_body_size 50M;

  ssl_certificate /etc/letsencrypt/live/taskflow.dan-tech.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taskflow.dan-tech.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Flutter Web shell files must be revalidated on every navigation.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache" always;
  }

  # 보안: PHP 관련 요청 원천 차단
  location ~* \.(php|phps|phtml|php5|php7)$ {
    return 404;
  }

  # 정적 자산(JS/CSS 등) 캐시 및 처리
  location ~* ^/(assets)/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable" always;
  }

  # SPA 라우팅 및 PHP 요청 2차 방어
  location / {
    if ($uri ~* "\.php$") {
      return 404;
    }
    try_files $uri $uri/ /index.html;
  }

  # API 요청 프록시 (Backend-Dev 연결)
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend-dev:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# 3. Dev CDN 서비스 (SSL 8444)
server {
  listen 8444 ssl;
  server_name dev.cdn.dan-tech.com;

  ssl_certificate /etc/letsencrypt/live/taskflow.dan-tech.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taskflow.dan-tech.com/privkey.pem;

  # CDN 파일 경로 설정
  location ^~ /files/inline-images/ {
    alias /var/www/cdn_files/inline-images/; 
    autoindex off;
    add_header Access-Control-Allow-Origin *;
  }

  location ^~ /files/suppliers/ {
    alias /var/www/cdn_files/suppliers/;
    autoindex off;
    add_header Access-Control-Allow-Origin *;
  }

  location ^~ /files/images/ {
    alias /var/www/cdn_files/images/;
    autoindex off;
    add_header Access-Control-Allow-Origin *;
  }

  # 그 외 접근 차단
  location ^~ /files/ {
    return 403;
  }
}