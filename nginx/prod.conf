server {
  listen 80;
  server_name taskflow.dan-tech.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name taskflow.dan-tech.com;

  set_real_ip_from 172.18.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  access_log /var/log/nginx/taskflow_access.log main;

  client_max_body_size 50M;

  ssl_certificate /etc/letsencrypt/live/taskflow.dan-tech.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taskflow.dan-tech.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # PHP 관련 요청은 절대 처리하지 않음 (보안 강화)
  location ~* \.(php|phps|phtml|php5|php7)$ {
    return 404;
  }

  # PHP 요청을 SPA로 리다이렉트되지 않게 직접 차단
  location / {
    if ($uri ~* "\.php$") {
      return 404;
    }
    try_files $uri $uri/ /index.html;
  }

  # API 요청 프록시
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend-prod:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
