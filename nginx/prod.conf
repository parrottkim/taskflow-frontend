# 1. HTTP -> HTTPS 리다이렉트 (모든 도메인 공통)
server {
  listen 80;
  server_name taskflow.dan-tech.com cdn.dan-tech.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# 2. Taskflow 메인 애플리케이션 (SSL 8443)
server {
  listen 8443 ssl;
  http2 on;
  server_name taskflow.dan-tech.com;

  # Real IP 설정 (프록시 환경인 경우)
  set_real_ip_from 172.18.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  access_log /var/log/nginx/taskflow_access.log main;
  client_max_body_size 50M;

  ssl_certificate /etc/letsencrypt/live/taskflow.dan-tech.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taskflow.dan-tech.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Flutter Web shell files must be revalidated on every navigation.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache" always;
  }

  # Hashed static assets can be cached aggressively.
  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable" always;
  }

  # 보안: PHP 파일 직접 접근 차단
  location ~* \.(php|phps|phtml|php5|php7)$ {
    return 404;
  }

  # 메인 서비스 및 SPA 라우팅
  location / {
    if ($uri ~* "\.php$") {
      return 404;
    }
    try_files $uri $uri/ /index.html;
  }

  # API 요청 프록시
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend-prod:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# 3. CDN 서비스 (SSL 8443)
server {
  listen 8443 ssl;
  server_name cdn.dan-tech.com;

  ssl_certificate /etc/letsencrypt/live/taskflow.dan-tech.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taskflow.dan-tech.com/privkey.pem;

  # 이미지 및 정적 파일 경로 설정 (Alias 사용)
  location ^~ /files/inline-images/ {
    alias /var/www/cdn_files/inline-images/; 
    autoindex off;
    add_header Access-Control-Allow-Origin *;
  }

  location ^~ /files/suppliers/ {
    alias /var/www/cdn_files/suppliers/;
    autoindex off;
    add_header Access-Control-Allow-Origin *;
  }

  location ^~ /files/images/ {
    alias /var/www/cdn_files/images/;
    autoindex off;
    add_header Access-Control-Allow-Origin *;
  }

  # 그 외 /files/ 하위 접근은 모두 차단
  location ^~ /files/ {
    return 403;
  }
}